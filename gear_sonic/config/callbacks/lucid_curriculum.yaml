# LUCID domain-randomization curriculum: latent gap -> PI controller -> lambda.
# Requires practice_observer for the gap. Disabled by default.
#
# NOTE ON COVERAGE: only reset- and interval-mode event terms can be rescaled at
# runtime. Use manager_env/events=tracking/lucid_curriculum, whose reset-safe
# replacements expose all six channels. The callback logs scalable_terms so a
# run states exactly which channels it moved.
lucid_curriculum:
  _target_: gear_sonic.research.practice_utility.dr_curriculum.LucidCurriculumCallback
  enabled: false
  mode: lucid              # lucid | fixed | off
  observer_branch_id: null
  output_dir: null
  branch_id: unbound
  initial_lambda: 0.0
  fixed_lambda: 1.0        # used by mode=fixed
  # delta_target should be calibrated per encoder via dr_controller.calibrate_target;
  # latent scales differ between encoders so a constant does not transfer.
  delta_target: 0.10
  kp: 1.0
  ki: 0.1
  alpha: 0.05
  integral_max: 5.0
  quantile: 0.9
  return_floor: null
  return_decay: 0.5
  update_every: 1

  # Hold lambda for the first N iterations after a (re)start. Gap and return
  # estimates are dominated by the restart transient -- measured at up to 28%
  # relative spread in early iterations -- so reacting to them moves difficulty
  # on noise.
  warmup_iterations: 4
  # Path to a curriculum_state_*.json to resume from. WITHOUT THIS a resumed run
  # silently restarts the curriculum at initial_lambda: the environment jumps
  # back to easy and the curriculum re-climbs from zero. Nothing errors; the
  # learning curve just looks worse than it should.
  resume_state_path: null
  # Optional cap on how far lambda may jump on resume, for when the restored
  # intensity does not match the environment about to be trained in.
  max_lambda_step_on_resume: null
