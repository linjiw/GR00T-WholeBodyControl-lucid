# Nominal-physics evaluation. It keeps the same six event terms and delayed
# actuator code path as the DR arms, but collapses every distribution to its
# LUCID lambda=0 nominal. This isolates clean-retention from robustness.

defaults:
  - terms/physics_material@_here_
  - terms/add_joint_default_pos@_here_
  - terms/base_com@_here_
  - terms/push_robot@_here_
  - terms/randomize_rigid_body_mass@_here_
  - terms/randomize_action_delay@_here_

_target_: gear_sonic.research.practice_utility.events_reset_safe.LucidEventCfg

physics_material:
  mode: "reset"
  params:
    static_friction_range: [0.95, 0.95]
    dynamic_friction_range: [0.75, 0.75]
    restitution_range: [0.0, 0.0]

add_joint_default_pos:
  func: gear_sonic.research.practice_utility.events_reset_safe:randomize_joint_default_pos
  mode: "reset"
  params:
    asset_cfg:
      _target_: isaaclab.managers.SceneEntityCfg
      name: "robot"
      joint_names: [".*"]
    pos_distribution_params: [0.0, 0.0]
    operation: "add"

base_com:
  func: gear_sonic.research.practice_utility.events_reset_safe:randomize_rigid_body_com
  mode: "reset"
  params:
    com_range:
      x: [0.0, 0.0]
      y: [0.0, 0.0]
      z: [0.0, 0.0]

push_robot:
  params:
    velocity_range:
      x: [0.0, 0.0]
      y: [0.0, 0.0]
      z: [0.0, 0.0]
      roll: [0.0, 0.0]
      pitch: [0.0, 0.0]
      yaw: [0.0, 0.0]

randomize_rigid_body_mass:
  mode: "reset"
  params:
    asset_cfg:
      _target_: isaaclab.managers.SceneEntityCfg
      name: "robot"
      body_names: ".*wrist_yaw.*|torso_link"
    mass_distribution_params: [1.0, 1.0]
    operation: "scale"

randomize_action_delay:
  params:
    delay_range: [0.0, 0.0]
